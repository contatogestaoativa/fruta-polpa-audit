    <!-- Inter Tight (corpo) + TikTok Sans com eixo de largura (títulos em SemiExpanded) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=TikTok+Sans:wdth,wght@100..120,400;100..120,500;100..120,800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { color-scheme: dark; }
      html[data-tema="light"] { color-scheme: light; }
      body { background: #0E0400; color: #FFF0E6; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
      html[data-tema="light"] body { background: #FFF3EA; color: #1E0B00; }
      #root { min-height: 100vh; }


      /* títulos e primeiro parágrafo de cada tela: sombra suave para destacar do cenário */
      html[data-tema="dark"] .fp-conteudo h1, html[data-tema="dark"] .fp-conteudo h1 + p { text-shadow: 0 1px 2px rgba(14, 4, 0, 0.9), 0 0 22px rgba(14, 4, 0, 0.95); }
      html[data-tema="light"] .fp-conteudo h1, html[data-tema="light"] .fp-conteudo h1 + p { text-shadow: 0 0 20px rgba(255, 243, 234, 0.95); }

      ::selection { background: rgba(255, 90, 26, 0.45); color: #fff; }
      :focus-visible { outline: 2px solid #FF7A3D; outline-offset: 2px; border-radius: 6px; }
      button { font-family: inherit; transition: background-color .15s, border-color .15s, color .15s, box-shadow .15s; }
      button:not(:disabled):hover { border-color: rgba(255, 130, 70, 0.6); }
      input, select, textarea { font-family: inherit; }
      * { scrollbar-width: thin; scrollbar-color: rgba(255, 130, 70, 0.35) transparent; }

      /* feixe de luz: única animação não provocada — entra uma vez ao carregar */
      @keyframes fp-luz { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: none; } }
      .fp-luz { animation: fp-luz 1.1s cubic-bezier(.2,.7,.2,1) both; }
      /* tela de acesso: entrada orquestrada (uma vez), brilho que cruza a logo e flutuação suave */
      @keyframes fp-entra { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      .fp-entra { animation: fp-entra .9s cubic-bezier(.2,.7,.2,1) both; }
      /* slogan numa linha só: o tamanho acompanha a largura da coluna da marca */
      .fp-marca { container-type: inline-size; }
      .fp-slogan { font-size: clamp(24px, 4vw, 56px); font-size: clamp(24px, 10.2cqw, 72px); }
      /* grifo: o marca-texto é "passado" uma vez, da esquerda para a direita */
      .fp-grifo { transform-origin: left center; animation: fp-grifar .95s cubic-bezier(.65,.05,.2,1) 1.1s both; transform: skewX(-7deg); }
      @keyframes fp-grifar { from { transform: skewX(-7deg) scaleX(0); } to { transform: skewX(-7deg) scaleX(1); } }
      @keyframes fp-flutua { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .fp-flutua { animation: fp-flutua 7s ease-in-out infinite; }
      .fp-brilho { background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.6) 50%, transparent 62%); background-size: 260% 100%; background-position: 160% 0; animation: fp-brilho 6s ease-in-out 1.6s infinite; }
      @keyframes fp-brilho { 0% { background-position: 160% 0; } 30%, 100% { background-position: -60% 0; } }
      @media (max-width: 880px) { .fp-login-grid { grid-template-columns: 1fr !important; padding-top: 36px !important; } }
